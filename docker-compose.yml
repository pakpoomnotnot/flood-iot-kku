services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flood-nextjs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    networks:
      - flood-net

  nginx:
    image: nginx:alpine
    container_name: flood-nginx
    restart: unless-stopped
    ports:
      - "3443:3443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - nextjs
    networks:
      - flood-net

networks:
  flood-net:
    driver: bridge
